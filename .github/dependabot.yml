version: 2

# One PR a month covering npm and GitHub Actions together.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly
    ignore:
      # typescript-eslint 8 doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly
